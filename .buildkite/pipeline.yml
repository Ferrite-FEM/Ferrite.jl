steps:
  - label: ":julia: CUDA"
    notify:
      - github_commit_status:
          context: "Test GPU / Julia 1"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-coverage#v1:
          dirs: ["src", "ext"]
    env:
      FERRITE_GPU_BACKEND: "cuda"
    command: |
      julia --code-coverage=@ --project=test/GPU/cuda -e 'using Pkg; Pkg.instantiate()'
      julia --code-coverage=@ --project=test/GPU/cuda test/GPU/runtests.jl
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60

  # The vendor steps below run the same test suite as the CUDA step above. They are allowed
  # to fail until they have been seen green on the corresponding agents.
  - label: ":julia: AMDGPU"
    notify:
      - github_commit_status:
          context: "Test GPU (AMDGPU) / Julia 1"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    env:
      FERRITE_GPU_BACKEND: "amdgpu"
    command: |
      julia --project=test/GPU/amdgpu -e 'using Pkg; Pkg.instantiate()'
      julia --project=test/GPU/amdgpu test/GPU/runtests.jl
    agents:
      queue: "rocm"
      rocmgpu: "*"
    soft_fail: true
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60

  - label: ":julia: oneAPI"
    notify:
      - github_commit_status:
          context: "Test GPU (oneAPI) / Julia 1"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    env:
      FERRITE_GPU_BACKEND: "oneapi"
    command: |
      julia --project=test/GPU/oneapi -e 'using Pkg; Pkg.instantiate()'
      julia --project=test/GPU/oneapi test/GPU/runtests.jl
    agents:
      queue: "oneapi"
    soft_fail: true
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60

  - label: ":julia: Metal"
    notify:
      - github_commit_status:
          context: "Test GPU (Metal) / Julia 1"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    env:
      FERRITE_GPU_BACKEND: "metal"
    command: |
      julia --project=test/GPU/metal -e 'using Pkg; Pkg.instantiate()'
      julia --project=test/GPU/metal test/GPU/runtests.jl
    agents:
      queue: "juliaecosystem"
      os: "macos"
      arch: "aarch64"
    soft_fail: true
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60
