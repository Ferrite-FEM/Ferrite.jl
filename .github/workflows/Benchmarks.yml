# Untrusted half of the two-workflow Tachometer setup: this runs the PR's benchmark code, so
# it gets a read-only token and no secrets. It only measures and uploads an artifact, which
# the trusted reporter (BenchmarksReport.yml) picks up and posts as a PR comment.
name: Benchmarks

on:
  pull_request:
    branches: ['master']
    # Docs-only PRs can't move the numbers. NOTE: a skipped workflow never reports a status,
    # so drop this filter if the benchmark is ever made a required check.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: tachometer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    # Apple Silicon rather than ubuntu-latest: this suite is single-threaded CPU work, where the
    # macOS runners are both faster and less noisy than the shared Linux VMs. Keep this in sync
    # with the `record` job in BenchmarkTracking.yml -- the noise band is derived from that time
    # series, and variance is a property of the runner.
    runs-on: macos-latest
    # A pass is ~200 s locally (~35 s to build the suite, ~165 s to run it), and `nruns: 1`
    # means two of them, one per revision.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so that the merge-base can be resolved

      # The noise model is derived READ-ONLY from the master time series published by
      # BenchmarkTracking.yml, so a PR can never train it. Extract it from the trusted gh-pages
      # ref into a directory OUTSIDE the PR checkout (via `git archive`, so a PR-committed
      # directory can't stand in for it). Until gh-pages has benchmark data the directory is
      # empty and the flat time-tolerance below is used instead.
      - name: Fetch published history (read-only noise source)
        run: |
          dest="${RUNNER_TEMP}/tacho-history"
          rm -rf "$dest"; mkdir -p "$dest"
          if git fetch --no-tags --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD benchmarks/data 2>/dev/null | tar -x -C "$dest" 2>/dev/null || true
          fi
        continue-on-error: true

      - uses: KristofferC/Tachometer.jl@0ea32437d4a7aba6f8598f4ce7efa26316ca09e8 # v1
        id: tachometer
        with:
          julia-version: '1'
          script: benchmark/benchmarks.jl
          nruns: '1'
          time-tolerance: '0.05'
          time-floor: '1us'
          noise-history: ${{ runner.temp }}/tacho-history/benchmarks/data

      # `errored` means no comparison was produced at all -- the suite failed to load or run on
      # one of the revisions. Without this the job is green either way, which is how the
      # assembly benchmarks managed to measure nothing for as long as they did. `not_comparable`
      # is deliberately not an error: it is the normal result when a PR adds or removes
      # benchmarks.
      - name: Fail if the benchmarks did not run
        if: steps.tachometer.outputs.status == 'errored'
        run: |
          echo "::error::Tachometer reported status=errored: no benchmark comparison was produced."
          exit 1
