name: Test
on:
  pull_request:
  push:
    branches: ['master']
    tags: ['*']
concurrency:
  # Cancel in progress builds for PRs with new commits
  group: ${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.ref, 'refs/pull/') && 'pr' || github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.julia-version == 'pre' || matrix.julia-version == 'nightly' }}
    strategy:
      matrix:
        julia-version: ['lts', '1', 'pre', 'nightly']
        os: ['ubuntu-latest']
        threads: ['2']
        include:
          - os: windows-latest
            julia-version: '1'
            threads: '2'
          - os: macOS-latest
            julia-version: '1'
            threads: '2'
          - os: ubuntu-latest
            julia-version: '1'
            threads: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - name: JET tests
        shell: julia --color=yes --project=@jet {0}
        run: |
          using Pkg
          Pkg.add("JET")
          Pkg.develop(path = pwd())
          include(joinpath(pwd(), "test/jet.jl"))
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.julia-version != 'pre' && matrix.julia-version != 'nightly' }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: 'src,ext'
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          plugins: noop
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
